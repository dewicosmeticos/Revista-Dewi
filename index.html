<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Revista Dewi — Cosméticos & Perfumaria Premium</title>
<meta name="description" content="K-Beauty coreano e perfumaria árabe numa curadoria exclusiva. Leia a Revista Dewi.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --cream: #f7f2e7;
    --cream-deep: #efe5cf;
    --paper: #fffdf8;
    --gold: #ad8a45;
    --gold-deep: #8c6f34;
    --gold-light: #d8c393;
    --ink: #2c2317;
    --ink-soft: #6b5d47;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin: 0;
    min-height: 100%;
  }

  body{
    font-family: 'Jost', sans-serif;
    color: var(--ink);
    background: radial-gradient(circle at 18% 12%, #fbf4e2 0%, transparent 45%),
                radial-gradient(circle at 85% 88%, #f1e3c4 0%, transparent 50%),
                var(--cream);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 18px;
  }

  .card{
    width: 100%;
    max-width: 460px;
    background: var(--paper);
    border: 1px solid var(--gold-light);
    border-radius: 3px;
    padding: 36px 38px 44px;
    text-align: center;
    box-shadow: 0 30px 60px -25px rgba(140, 111, 52, 0.35);
    opacity: 0;
    transform: translateY(10px);
    animation: rise 700ms ease-out forwards;
  }

  @media (prefers-reduced-motion: reduce){
    .card{ animation: none; opacity: 1; transform: none; }
  }

  @keyframes rise{
    to{ opacity: 1; transform: translateY(0); }
  }

  .mark{
    width: 220px;
    max-width: 80%;
    height: auto;
    margin: 0 auto 8px;
    display: block;
  }

  .tagline{
    font-size: 11px;
    letter-spacing: 3px;
    color: var(--gold-deep);
    text-transform: uppercase;
    margin: 10px 0 22px;
  }

  .divider{
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    color: var(--gold);
    margin: 0 0 26px;
  }
  .divider::before, .divider::after{
    content: "";
    height: 1px;
    width: 56px;
    background: var(--gold-light);
  }
  .divider span{ font-size: 13px; }

  .eyebrow{
    font-size: 11px;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin: 0 0 10px;
  }

  h1{
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-weight: 500;
    font-size: 25px;
    line-height: 1.35;
    margin: 0 0 16px;
    color: var(--ink);
  }

  p.lede{
    font-size: 15px;
    line-height: 1.65;
    color: var(--ink-soft);
    margin: 0 0 30px;
  }

  .cta{
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: var(--gold);
    color: var(--paper);
    text-decoration: none;
    font-family: 'Jost', sans-serif;
    font-size: 13px;
    letter-spacing: 2px;
    text-transform: uppercase;
    padding: 16px 30px;
    border-radius: 2px;
    transition: background 180ms ease, transform 180ms ease;
  }
  .cta:hover{ background: var(--gold-deep); transform: translateY(-1px); }
  .cta:focus-visible{ outline: 2px solid var(--gold-deep); outline-offset: 3px; }

  .secondary{
    display: block;
    margin-top: 16px;
    font-size: 12.5px;
    color: var(--ink-soft);
    text-decoration: none;
    border-bottom: 1px solid var(--gold-light);
  }
  .secondary:hover{ color: var(--gold-deep); }

  footer{
    margin-top: 36px;
    font-size: 11.5px;
    letter-spacing: 1.5px;
    color: var(--ink-soft);
    text-transform: uppercase;
  }
  footer a{
    color: var(--gold-deep);
    text-decoration: none;
  }
</style>
</head>
<body>

  <main class="card">
    <img class="mark" src="./logo.png" alt="Dewi">

    <p class="tagline">Cosméticos &amp; Perfumaria Premium</p>

    <div class="divider"><span>✦</span></div>

    <a class="cta" href="./Revista_Dewi_final_18_300DPI.pdf" target="_blank" rel="noopener">
      Ler revista
    </a>
    <a class="secondary" href="./Revista_Dewi_final_18_300DPI.pdf" download>Baixar PDF</a>

    <footer>
      <a href="https://instagram.com/dewicosmeticos" target="_blank" rel="noopener">@dewicosmeticos</a>
    </footer>
  </main>

</body>
</html>
